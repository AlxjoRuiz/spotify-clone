<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Spotify</title>
    <!-- Hoja de estilos del dashboard (tema Spotify oscuro) -->
    <link rel="stylesheet" href="../styles/dashboard.css">
    <!-- Iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <!-- Tipografía Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Contenedor general: grilla de sidebar + header + contenido -->
    <div class="dashboard-container">

        <!-- ======== SIDEBAR ======== -->
        <div class="sidebar">
            <h2>Spotify Dashboard</h2>

            <!-- Buscador de música -->
            <div class="buscador">
                <input type="text" id="input-buscar" placeholder="Buscar canciones...">
                <button id="btn-buscar">Buscar</button>
            </div>

            <!-- Navegación principal -->
            <nav>
                <ul>                  
                    <li><a href="#" class="activo">Inicio</a></li>
                    <li><a href="#">Explorar</a></li>
                    <li><a href="#">Biblioteca</a></li>
                    <li><a href="#">Perfil</a></li>
                </ul>
            </nav>
        </div>

        <!-- ======== HEADER (barra superior) ======== -->
        <div class="header">
            <!-- Saludo dinámico según la hora (mañana/tarde/noche) -->
            <span class="greeting" id="greeting">¡Hola!</span>

            <!-- Perfil del usuario logueado + botón logout -->
            <div class="perfil">
                <i class="fa-solid fa-user"></i>
                <span id="nombre-perfil">Usuario</span>
                <button id="btn-logout" title="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>

        <!--CONTENIDO PRINCIPAL (vistas)-->
        <div class="main-content">

            <!-- Vista Inicio: playlists populares -->
            <div class="vista activa" id="vista-inicio">
                <h2 class="vista-titulo">Para empezar</h2>
                <div id="playlists"></div>
            </div>

            <!-- Vista Explorar: resultados de búsqueda -->
            <div class="vista" id="vista-explorar">
                <h2 class="vista-titulo">Buscá tu música favorita</h2>
            </div>

            <!-- Vista Biblioteca: canciones escuchadas recientemente -->
            <div class="vista" id="vista-biblioteca">
                <h2 class="vista-titulo">Escuchado recientemente</h2>
                <div id="canciones-recientes"></div>
            </div>

            <!-- Vista Perfil: datos reales del usuario desde Spotify -->
            <div class="vista" id="vista-perfil">
                <h2 class="vista-titulo">Tu perfil</h2>
                <div class="perfil-container" id="perfil-container">
                    <!-- Se llena dinámicamente con JavaScript -->
                    <div class="perfil-loading">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <p>Cargando perfil...</p>
                    </div>
                </div>

                <!-- Top artistas del usuario -->
                <h2 class="vista-titulo">Tus artistas favoritos</h2>
                <div id="top-artistas">
                <!-- Tus canciones favoritas (se llena con JavaScript) -->
                <h2 class="vista-titulo">Tus canciones favoritas</h2>
                <div id="top-tracks"></div>                   
                    <!-- Se llena dinámicamente con JavaScript -->
                </div>
            </div>

        </div>

        <!-- REPRODUCTOR (barra inferior) -->
        <div class="reproductor">
            <!-- Info de la canción actual -->
            <div class="info-cancion">
                <img id="reproductor-portada" src="" alt="">
                <div class="texto">
                    <span class="nombre" id="reproductor-nombre">Sin reproducir</span>
                    <span class="artista" id="reproductor-artista">-</span>
                </div>
            </div>

            <!-- Controles centrales del reproductor -->
            <div class="controles-centrales">
                <!-- Botones de control -->
                <div class="botones-control">
                    <button id="btn-anterior" title="Anterior">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="btn-play" title="Reproducir">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button id="btn-siguiente" title="Siguiente">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

                <!-- Barra de progreso -->
                <div class="progreso-container">
                    <span id="tiempo-actual">0:00</span>
                    <input type="range" id="barra-progreso" value="0" max="100" step="0.1">
                    <span id="tiempo-total">0:00</span>
                </div>
            </div>

            <!-- Control de volumen -->
            <div class="control-volumen">
                <button id="btn-volumen" title="Silenciar">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <input type="range" id="barra-volumen" value="70" max="100" step="1">
            </div>

            <!-- Elemento audio oculto (solo para manejar el sonido) -->
            <audio id="audio-control"></audio>
        </div>

    </div>

    <!-- Script que maneja vistas, playlists, búsqueda y saludo -->
    <script src="../scripts/dashboard.js"></script>
</body>
</html>
