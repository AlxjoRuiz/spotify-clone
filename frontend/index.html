<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOTIFY</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <video autoplay muted loop id="video-fondo">
        <source src="assets/video/video.mp4" type="video/mp4">
    </video>
    <div class="login">
        <img id="logo" src="assets/imagenes/spotify-logo.png" alt="logo">
        <h1>¡BIENVENIDO A SPOTIFY!</h1>
        <p>Millions of songs free on Spotify</p>

        <a href="http://localhost:3000/auth/google" class="btn-google" id="btn-google">
            <i class="fa-brands fa-google"></i> Connect with Google
        </a>

        <button class="btn-login" id="btn-login">log in</button>
    </div>
</body>

</html>
